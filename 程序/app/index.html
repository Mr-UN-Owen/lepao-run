<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乐跑控制台 · lepao console</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131920; --panel-2:#0f151c; --line:#1f2937;
    --txt:#e6edf3; --dim:#8b98a5; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --err:#f85149;
    --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 15% -10%,#12202f 0%,var(--bg) 55%);
    color:var(--txt);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:14px 22px;
    border-bottom:1px solid var(--line);background:rgba(11,15,20,.85);backdrop-filter:blur(8px);
    position:sticky;top:0;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok)}
  .dot.idle{background:var(--dim);box-shadow:none}
  .dot.busy{background:var(--warn);box-shadow:0 0 12px var(--warn);animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    font:11px/1 var(--mono);color:var(--dim);border:1px solid var(--line);
    padding:6px 9px;border-radius:999px;background:var(--panel-2);white-space:nowrap;
  }
  main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;padding:18px 22px 28px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media (max-width:880px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card h2{margin:0;padding:13px 16px;font-size:12px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel-2)}
  .pad{padding:14px 16px}
  .member{
    display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:background .15s;
  }
  .member:last-child{border-bottom:0}
  .member:hover{background:#161e28}
  .member.sel{background:#12202f;box-shadow:inset 3px 0 0 var(--accent)}
  .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .name{font-weight:600}
  .sub{font:11.5px/1.4 var(--mono);color:var(--dim);word-break:break-all}
  .badge{font:10.5px/1 var(--mono);padding:4px 7px;border-radius:6px;border:1px solid transparent}
  .b-ready{color:#7ee787;background:rgba(63,185,80,.12);border-color:rgba(63,185,80,.3)}
  .b-empty{color:var(--dim);background:#1a222c;border-color:var(--line)}
  .b-consumed{color:#e3b341;background:rgba(210,153,34,.12);border-color:rgba(210,153,34,.3)}
  input,button{font:inherit;color:inherit}
  input{
    width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);outline:none;transition:border-color .15s;
  }
  input:focus{border-color:var(--accent)}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{
    border:1px solid var(--line);background:#1a222c;padding:9px 14px;border-radius:9px;
    cursor:pointer;transition:transform .08s,background .15s,border-color .15s;font-weight:560;
  }
  button:hover{background:#1f2a36;border-color:#2b3a4a}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:#4a92ff;color:#fff}
  button.primary:hover{background:#4a92ff}
  button.ghost{background:transparent}
  button.danger{color:#ff9a92;border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.08)}
  button.danger:hover{background:rgba(248,81,73,.16)}
  .log{
    font:12.5px/1.62 var(--mono);height:min(58vh,620px);overflow:auto;padding:12px 16px;
    background:#080c11;white-space:pre-wrap;word-break:break-word;
  }
  .log .t{color:#4d5866;margin-right:8px}
  .log .e{color:#ff9a92}
  .log .w{color:#e3b341}
  .log .g{color:#7ee787}
  .hint{font-size:12px;color:var(--dim);margin-top:8px}
  .err{color:#ff9a92;font-size:12.5px;margin-top:8px;min-height:1em}
  footer{padding:0 22px 22px;color:#55616e;font:11px/1.6 var(--mono)}
  a{color:#6ea8ff;text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="brand"><span id="dot" class="dot idle"></span> 乐跑控制台</div>
  <div class="meta">
    <span class="chip" id="chip-backend">AES …</span>
    <span class="chip" id="chip-host">host …</span>
    <span class="chip" id="chip-task">空闲</span>
  </div>
</header>

<main>
  <aside class="col">
  <section class="card">
    <h2>成员</h2>
    <div id="members"></div>
    <div class="pad" style="border-top:1px solid var(--line)">
      <input id="in-name" placeholder="姓名 / 备注">
      <input id="in-num" placeholder="学号" style="margin-top:8px">
      <div class="btnrow">
        <button class="primary" onclick="addAccount()">登记成员</button>
        <button class="ghost" onclick="removeAccount()">移除选中</button>
      </div>
      <div class="hint">学号是主键；uid 在首次抓号后自动回填。</div>
      <div class="err" id="err-box"></div>
    </div>
  </section>

  <section class="card">
    <h2>网页账号登录（H5 面）</h2>
    <div class="pad">
      <div class="hint" style="margin:0 0 8px">
        账号 + 密码 + 验证码直连 H5 登录链，不需要抓包、不需要 root。
      </div>
      <input id="h5-school" placeholder="school_id（学校编号，必填）">
      <input id="h5-account" placeholder="账号（学号 / 邮箱）" style="margin-top:8px">
      <input id="h5-password" type="password" placeholder="密码" style="margin-top:8px">
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <input id="h5-verify" placeholder="验证码" style="flex:1">
        <img id="h5-cap" alt="验证码" title="点击刷新"
             style="height:38px;width:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#0f151c;cursor:pointer"
             onclick="loadCaptcha()">
      </div>
      <div class="btnrow">
        <button class="primary" onclick="h5Login()" id="btn-h5login">登录</button>
        <button class="ghost" onclick="loadCaptcha()">换一张</button>
        <button class="ghost" onclick="h5Probe()" id="btn-h5probe">探测接口</button>
      </div>
      <div class="sub" id="h5-status" style="margin-top:10px">未登录</div>
      <div class="err" id="h5-err"></div>
      <div id="h5-probe" class="sub" style="margin-top:6px"></div>
    </div>
  </section>
  </aside>

  <section class="card">
    <h2>执行</h2>
    <div class="pad">
      <div class="row">
        <div>
          <div class="name" id="sel-name">未选择成员</div>
          <div class="sub" id="sel-sub">点击左侧成员卡片</div>
        </div>
        <div class="btnrow" style="margin:0">
          <button onclick="run(false)" id="btn-dry">干跑（零写入）</button>
          <button class="primary" onclick="run(true)" id="btn-submit">提交打卡</button>
          <button class="danger" onclick="stop()" id="btn-stop">停止</button>
        </div>
      </div>
      <div class="hint">干跑不取 STS、不上传、不提交，只验证跑区/打卡点/额度/轨迹覆盖。提交会真实写一条记录，每日上限按 policy。</div>
    </div>
    <h2>日志</h2>
    <div class="log" id="log"></div>
  </section>
</main>

<footer>
  协议层来自 <a href="https://github.com/dan-cun/lepao3" target="_blank" rel="noreferrer">lepao3</a>（LRL-1.0，仅供学习、不可牟利）。
  本控制台只驱动本机协议库，不上传任何数据。
</footer>

<script>
let STATE = null;
let selected = "";
let cursor = 0;
let logTotal = 0;

const $ = id => document.getElementById(id);

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

async function api(path, body){
  const opt = body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return r.json();
}

function renderState(s){
  STATE = s;
  if(!s.ok){
    $("err-box").textContent = s.error || "状态读取失败";
    return;
  }
  $("chip-backend").textContent = "AES " + s.backend;
  $("chip-host").textContent = "host " + (s.api_host || "未配置");
  const t = s.task || {};
  $("chip-task").textContent = t.running ? `运行中 · ${t.kind==="submit"?"提交":"干跑"}` : "空闲";
  $("dot").className = "dot " + (t.running ? "busy" : "");

  if(!selected && s.active) selected = s.active;
  const box = $("members");
  if(!s.members.length){
    box.innerHTML = '<div class="pad" style="color:#8b98a5">还没有成员。先登记一个（姓名 + 学号）。</div>';
  } else {
    box.innerHTML = s.members.map(m=>`
      <div class="member ${m.key===selected?"sel":""}" onclick="selectMember('${esc(m.key)}')">
        <div class="row">
          <span class="name">${esc(m.name)}${m.key===s.active?' <span class="sub">· active</span>':''}</span>
          <span class="badge b-${m.token}">${m.token==="ready"?"token 就绪":m.token==="consumed"?"已消耗":"无 token"}</span>
        </div>
        <div class="sub">学号 ${esc(m.key)} · uid ${m.uid||"-"} · 学校 ${m.school_id||"-"}</div>
      </div>`).join("");
  }

  const cur = s.members.find(m=>m.key===selected);
  $("sel-name").textContent = cur ? cur.name : "未选择成员";
  $("sel-sub").textContent = cur
    ? `学号 ${cur.key} · uid ${cur.uid||"-"} · ${cur.token==="ready"?"token 就绪，可直接干跑/提交":cur.token==="consumed"?"token 已消耗，需重新抓号":"无 token，先抓号或人工装载"}`
    : "点击左侧成员卡片";
  const busy = !!t.running;
  $("btn-dry").disabled = busy;
  $("btn-submit").disabled = busy;
  $("btn-stop").disabled = !busy;
  renderH5(s.h5);
}

function renderH5(h){
  if(!h) return;
  const st = $("h5-status");
  if(h.logged_in){
    st.textContent = `已登录：${h.account}（school_id ${h.school_id}）`;
    st.style.color = "#7ee787";
  }else{
    st.textContent = h.info ? `未登录 · ${h.info}` : "未登录";
    st.style.color = "";
  }
  if(h.probe && Object.keys(h.probe).length) renderProbe(h.probe);
}

function renderProbe(p){
  $("h5-probe").innerHTML = Object.entries(p).map(([k,v])=>{
    const mark = v.status === 1 ? "✓" : (v.status === 0 ? "×" : "?");
    const info = v.info || v.raw || v.error || "";
    return `${mark} <b>${esc(k)}</b> ${esc(String(info)).slice(0,90)}`;
  }).join("<br>");
}

async function loadCaptcha(){
  const sid = ($("h5-school").value || "").trim();
  $("h5-err").textContent = "";
  const r = await fetch("/api/h5/captcha" + (sid ? "?school_id=" + encodeURIComponent(sid) : ""))
    .then(x => x.json()).catch(e => ({ok:false, error:String(e)}));
  if(!r.ok){ $("h5-err").textContent = r.error || "取验证码失败"; return; }
  $("h5-cap").src = r.image;
  renderH5(r.h5);
}

async function h5Login(){
  const body = {
    school_id: Number(($("h5-school").value || "0").trim() || 0),
    account: ($("h5-account").value || "").trim(),
    password: $("h5-password").value || "",
    verify: ($("h5-verify").value || "").trim(),
  };
  if(!body.account || !body.password || !body.verify){
    $("h5-err").textContent = "账号 / 密码 / 验证码都要填";
    return;
  }
  if(!body.school_id){
    $("h5-err").textContent = "先填 school_id（学校编号）";
    return;
  }
  const r = await api("/api/h5/login", body);
  if(!r.ok){
    $("h5-err").textContent = r.info || r.error || "登录失败";
    loadCaptcha();
    return;
  }
  $("h5-err").textContent = "";
  $("h5-verify").value = "";
  renderH5(r.h5);
}

async function h5Probe(){
  const r = await api("/api/h5/probe", {});
  if(!r.ok){ $("h5-err").textContent = r.error || "探测失败"; return; }
  $("h5-err").textContent = "";
  renderH5(r.h5);
  renderProbe(r.probe || {});
}

function selectMember(k){ selected = k; renderState(STATE); }

async function addAccount(){
  const name = $("in-name").value.trim(), num = $("in-num").value.trim();
  if(!num){ $("err-box").textContent = "学号必填"; return; }
  const r = await api("/api/account/add", {name, student_num:num});
  if(!r.ok){ $("err-box").textContent = r.error||"登记失败"; return; }
  $("err-box").textContent = ""; $("in-name").value=""; $("in-num").value="";
  selected = r.key; renderState(r.state);
}

async function removeAccount(){
  if(!selected){ $("err-box").textContent = "先选中成员"; return; }
  if(!confirm(`移除成员 ${selected}？（只删本地登记，不影响平台账号）`)) return;
  const r = await api("/api/account/remove", {sel:selected});
  if(!r.ok){ $("err-box").textContent = r.error||"移除失败"; return; }
  selected = ""; renderState(r.state);
}

async function run(submit){
  if(!selected){ $("err-box").textContent = "先选中成员"; return; }
  if(submit && !confirm(`确认提交一条真实跑步记录？\n成员：${selected}\n（会消耗 token 并写入服务端，每日上限按 policy）`)) return;
  const r = await api("/api/run", {member:selected, submit});
  if(!r.ok){ $("err-box").textContent = r.error||"启动失败"; return; }
  $("err-box").textContent = "";
  pollLog();
}

async function stop(){ await api("/api/stop", {}); }

function paint(lines){
  const el = $("log");
  const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
  for(const l of lines){
    const d = document.createElement("div");
    const cls = /FATAL|错误|失败|异常|Traceback/.test(l.m) ? "e"
              : /^\[警告|warn|101/.test(l.m) ? "w" : (/过审|有效|OK/.test(l.m) ? "g" : "");
    d.innerHTML = `<span class="t">${esc(l.t)}</span><span class="${cls}">${esc(l.m)}</span>`;
    el.appendChild(d);
  }
  if(stick) el.scrollTop = el.scrollHeight;
}

async function pollLog(){
  const r = await fetch("/api/log?since=" + cursor).then(x=>x.json()).catch(()=>null);
  if(!r) return;
  if(r.lines && r.lines.length) paint(r.lines);
  cursor = r.total;
}

async function tick(){
  const s = await fetch("/api/state").then(x=>x.json()).catch(()=>null);
  if(s) renderState(s);
  await pollLog();
}

tick();
setInterval(tick, 2500);
</script>
</body>
</html>
